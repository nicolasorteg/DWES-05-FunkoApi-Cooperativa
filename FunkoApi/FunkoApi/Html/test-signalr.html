<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prueba de SignalR - FunkoApi</title>
    <!-- Carga de la librería cliente oficial de SignalR desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f6; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; }
        input { width: 88%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #log { font-family: monospace; background: #222; color: #eee; padding: 15px; border-radius: 5px; height: 300px; overflow-y: auto; margin-top: 15px; }
        .log-saludo { color: #ffffff; }
        .log-funko { color: #ff00ff; }
        .log-error { color: #ff5555; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Monitor SignalR - FunkoApi</h2>

    <label><b>URL del Hub:</b></label><br>
    <input type="text" id="huburl" value="http://localhost:5073/hubs/funkos"><br>

    <label><b>Token JWT:</b></label><br>
    <input type="text" id="jwtToken" placeholder="Pega aquí el Token de /api/auth/login"><br>

    <button onclick="conectar()">Conectar WebSocket</button>

    <div id="log">Esperando conexión...</div>
</div>

<script>
    let connection = null;

    function log(mensaje, cssClass = '') {
        const logDiv = document.getElementById("log");
        const hora = new Date().toLocaleTimeString();
        logDiv.innerHTML += `<div class="${cssClass}">[${hora}] ${mensaje}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function conectar() {
        const url = document.getElementById("huburl").value;
        const token = document.getElementById("jwtToken").value.trim();

        if (!token) {
            alert("¡Debes pegar primero el Token JWT generado en Bruno!");
            return;
        }

        if (connection) {
            await connection.stop();
        }

        connection = new signalR.HubConnectionBuilder()
            .withUrl(url, {
                accessTokenFactory: () => token
            })
            .withAutomaticReconnect()
            .build();

        // 1. Escuchar el saludo en segundo plano (cada 15s)
        connection.on("ReceiveGreeting", (mensaje) => {
            log(`📢 ${mensaje}`, "log-saludo");
        });

        // 2. Escuchar cuando se crea un Funko
        connection.on("FunkoCreado", (funko) => {
            log(`✨ [NUEVO FUNKO]: ${funko.nombre} - ${funko.precio}€`, "log-funko");
        });

        // 3. Escuchar cuando se actualiza un Funko (¡FALTABA ESTE!)
        connection.on("FunkoActualizado", (funko) => {
            log(`🔄 [FUNKO ACTUALIZADO]: ${funko.nombre} - ${funko.precio}€`, "log-funko");
        });

        // 4. Escuchar cuando se borra un Funko
        connection.on("FunkoEliminado", (id) => {
            log(`🗑️ [FUNKO ELIMINADO]: ID ${id}`, "log-error");
        });

        try {
            await connection.start();
            log("🟢 ¡Conectado con éxito a SignalR!", "log-saludo");
        } catch (err) {
            log(`🔴 Error de conexión: ${err}`, "log-error");
        }
    }
</script>
